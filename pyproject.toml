[project]
name = "purchase-predict-api"
version = "0.1.0"
description = "Flask inference API for the purchase prediction model"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0.0",
    "gunicorn>=21.2.0",
    "pandas<3.0.0",
    "mlflow==3.0.1",
    "scikit-learn>=1.4.0",
    "google-cloud-storage>=2.14.0",
    "lightgbm>=4.3.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
